name: Publish Nexus live snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Stagger away from minute 0 to reduce GitHub's high-load schedule delays.
    # Actual execution remains best-effort, not a freshness guarantee.
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover last published snapshot for stale-only fallback
        run: |
          # Best effort; cached prior reports never become fresh observations.
          curl --fail --silent --show-error --max-time 10 --connect-timeout 5 \
            -H 'Cache-Control: no-cache' \
            'https://dotsthewarlock.github.io/nexus/data/live.json?previous=${{ github.run_id }}' \
            -o /tmp/nexus-previous.json || echo 'No trusted previous snapshot available'
      - name: Collect official data
        env:
          ONTARIO_511_API_KEY: ${{ secrets.ONTARIO_511_API_KEY }}
        run: python scripts/fetch_live.py --output data/live.json --previous /tmp/nexus-previous.json
      - name: Validate published snapshot schema
        run: python scripts/validate_snapshot.py data/live.json
      - name: Report collection health
        run: python scripts/report_health.py data/live.json
      - name: Archive snapshot (rolling 30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/live.json
          retention-days: 30
          compression-level: 9
      - name: Test tunnel camera timing policy
        run: node tests/camera_timeout_lab.test.cjs
      - name: Test cropped Play and nine-second Resume policy
        run: node tests/camera_one_tap_timeout.test.cjs
      - name: Test in-modal Resume candidate policies
        run: node tests/camera_resume_candidates.test.cjs
      - name: Stage static website
        run: |
          mkdir -p site/data
          cp index.html styles.css app.js decision.js camera-diagnostics.html site/
          cp board.css board.js legacy.html site/
          cp dashboard.css dashboard.js destinations.js routing.js classic-board.html site/
          cp camera-timeout-lab.html camera-timeout-lab.js camera-one-tap-timeout.html camera-one-tap-timeout.js site/
          cp camera-resume-candidates.html camera-resume-candidates.js site/
          cp camera-alternatives.html site/
          cp camera-lab-v3.html site/
          cp camera-navigation-lab.html site/
          cp camera-modal-viability.html site/
          cp camera-modal-autoplay.html site/
          cp camera-pill-lifecycle.html site/
          cp camera-switch-reliability.html site/
          cp camera-playback-handoff.html site/
          cp camera-player-control-lab.html site/
          cp camera-mini-modal-lab.html site/
          cp camera-one-tap-lab.html site/
          cp data/live.json site/data/live.json
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages files after deployment
        # Informational during M2 evaluation: transient CDN propagation must not
        # falsely classify the collector or the deployment as failed.
        run: python scripts/verify_publication.py --snapshot-file data/live.json --site-file index.html --run-id "${{ github.run_id }}"

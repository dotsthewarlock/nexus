name: Publish Nexus live snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Stagger away from minute 0 to reduce GitHub's high-load schedule delays.
    # Actual execution remains best-effort, not a freshness guarantee.
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python collector tests
        run: python -m unittest discover -s tests -v
      - name: Decision engine tests
        run: node tests/decision.test.cjs
      - name: Three-crossing status dashboard tests
        run: node tests/status_board.test.cjs
      - name: Camera source regression tests
        run: node tests/camera_rc148.test.cjs
      - name: Standalone camera diagnostic tests
        run: node tests/camera_diagnostics.test.cjs
      - name: Alternative camera diagnostic tests
        run: node tests/camera_alternatives.test.cjs
      - name: DWT Camera Lab 3 tests
        run: node tests/camera_lab_v3.test.cjs
      - name: DWT camera navigation matrix tests
        run: node tests/camera_navigation.test.cjs
      - name: DWT modal viability lab tests
        run: node tests/camera_modal_viability.test.cjs
      - name: DWT player control lab tests
        run: node tests/camera_player_control.test.cjs
      - name: DWT miniature-to-modal lab tests
        run: node tests/camera_mini_modal.test.cjs
      - name: DWT one-tap crop lab tests
        run: node tests/camera_one_tap.test.cjs
      - name: DWT camera switch reliability lab tests
        run: node tests/camera_switch_reliability.test.cjs
      - name: Three-camera playback handoff diagnostic tests
        run: node tests/camera_playback_handoff.test.cjs
      - name: Recover last published snapshot for stale-only fallback
        run: |
          # Best effort; cached prior reports never become fresh observations.
          curl --fail --silent --show-error --max-time 10 --connect-timeout 5 \
            -H 'Cache-Control: no-cache' \
            'https://dotsthewarlock.github.io/nexus/data/live.json?previous=${{ github.run_id }}' \
            -o /tmp/nexus-previous.json || echo 'No trusted previous snapshot available'
      - name: Collect official data
        env:
          ONTARIO_511_API_KEY: ${{ secrets.ONTARIO_511_API_KEY }}
        run: python scripts/fetch_live.py --output data/live.json --previous /tmp/nexus-previous.json
      - name: Report collection health
        run: python scripts/report_health.py data/live.json
      - name: Archive snapshot (rolling 30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/live.json
          retention-days: 30
          compression-level: 9
      - name: Stage static website
        run: |
          mkdir -p site/data
          cp index.html board.css board.js legacy.html styles.css app.js decision.js camera-diagnostics.html site/
          cp camera-alternatives.html site/
          cp camera-lab-v3.html site/
          cp camera-navigation-lab.html site/
          cp camera-modal-viability.html site/
          cp camera-modal-autoplay.html site/
          cp camera-pill-lifecycle.html site/
          cp camera-switch-reliability.html site/
          cp camera-playback-handoff.html site/
          cp camera-player-control-lab.html site/
          cp camera-mini-modal-lab.html site/
          cp camera-one-tap-lab.html site/
          cp data/live.json site/data/live.json
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

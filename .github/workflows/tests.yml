name: Nexus regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python collector tests
        run: python -m unittest discover -s tests -v
      - name: Complete JavaScript regression suite (fail-closed aggregate)
        run: |
          failed=0
          echo "::group::Decision engine tests"
          node tests/decision.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::R2 shared model exact-boundary fixtures"
          node tests/r2_model.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::Current scope excludes navigation and preserves core border dashboard"
          node tests/navigation_deferred.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::M2c proposed independent scheduler offline safety tests"
          node tests/watchdog_m2c.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::DWT operator NEXUS lane provenance and stale data tests"
          node tests/dwt_dashboard.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::Approved M1 dual-direction dashboard checks"
          node tests/dashboard_m1.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::Root dashboard source-state acceptance checks"
          node tests/dashboard_source_states.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::Approved M3 paired-display and sort semantics fixtures"
          node tests/dashboard_m3.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::M4a material notices and closure-priority regression checks"
          node tests/notices_m4a.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::Three-crossing status dashboard tests"
          node tests/status_board.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::Camera modal and NEXUS schedule tests"
          node tests/camera_modal_board.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::Camera source regression tests"
          node tests/camera_rc148.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::Standalone camera diagnostic tests"
          node tests/camera_diagnostics.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::Alternative camera diagnostic tests"
          node tests/camera_alternatives.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::DWT Camera Lab 3 tests"
          node tests/camera_lab_v3.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::DWT camera navigation matrix tests"
          node tests/camera_navigation.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::DWT modal viability lab tests"
          node tests/camera_modal_viability.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::DWT player control lab tests"
          node tests/camera_player_control.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::DWT miniature-to-modal lab tests"
          node tests/camera_mini_modal.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::DWT one-tap crop lab tests"
          node tests/camera_one_tap.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::DWT camera switch reliability lab tests"
          node tests/camera_switch_reliability.test.cjs || failed=1
          echo "::endgroup::"
          echo "::group::Three-camera playback handoff diagnostic tests"
          node tests/camera_playback_handoff.test.cjs || failed=1
          echo "::endgroup::"
          exit "$failed"
      - name: Prepare Chromium mobile QA
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Primary mobile browser QA at 320/360/390/430 and 200% text
        run: python tests/dashboard_mobile_qa.py
      - name: R1 matched baseline and candidate visual QA
        run: |
          git fetch --no-tags --depth=1 origin 2898177440e6df2ca2a76fd5540cd2057b13e70b
          git worktree add --detach "$RUNNER_TEMP/nexus-r1-baseline" 2898177440e6df2ca2a76fd5540cd2057b13e70b
          python tests/r1_visual_qa.py "$RUNNER_TEMP/nexus-r1-baseline"
      - name: R2 differential and persistence QA against accepted R1
        run: |
          git fetch --no-tags --depth=1 origin 164adc33b1f60a55ecb9e0876397ae0d3747b32d
          git worktree add --detach "$RUNNER_TEMP/nexus-r2-baseline" 164adc33b1f60a55ecb9e0876397ae0d3747b32d
          node tests/r2_cross_surface.test.cjs "$RUNNER_TEMP/nexus-r2-baseline"
          python tests/r2_visual_qa.py "$RUNNER_TEMP/nexus-r2-baseline"
      - name: Preserve browser QA screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-mobile-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7

name: Nexus regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python collector tests
        run: python -m unittest discover -s tests -v
      - name: Decision engine tests
        run: node tests/decision.test.cjs
      - name: Current scope excludes navigation and preserves core border dashboard
        run: node tests/navigation_deferred.test.cjs
      - name: M2c proposed independent scheduler offline safety tests
        run: node tests/watchdog_m2c.test.cjs
      - name: DWT operator NEXUS lane provenance and stale data tests
        run: node tests/dwt_dashboard.test.cjs
      - name: Approved M1 dual-direction dashboard checks
        run: node tests/dashboard_m1.test.cjs
      - name: Root dashboard source-state acceptance checks
        run: node tests/dashboard_source_states.test.cjs
      - name: Approved M3 paired-display and sort semantics fixtures
        run: node tests/dashboard_m3.test.cjs
      - name: Prepare Chromium mobile QA
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Primary mobile browser QA at 320/360/390/430 and 200% text
        run: python tests/dashboard_mobile_qa.py
      - name: R1 matched baseline and candidate visual QA
        run: |
          git fetch --no-tags --depth=1 origin 2898177440e6df2ca2a76fd5540cd2057b13e70b
          git worktree add --detach "$RUNNER_TEMP/nexus-r1-baseline" 2898177440e6df2ca2a76fd5540cd2057b13e70b
          python tests/r1_visual_qa.py "$RUNNER_TEMP/nexus-r1-baseline"
      - name: Preserve browser QA screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-mobile-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: M4a material notices and closure-priority regression checks
        run: node tests/notices_m4a.test.cjs
      - name: Three-crossing status dashboard tests
        run: node tests/status_board.test.cjs
      - name: Camera modal and NEXUS schedule tests
        run: node tests/camera_modal_board.test.cjs
      - name: Camera source regression tests
        run: node tests/camera_rc148.test.cjs
      - name: Standalone camera diagnostic tests
        run: node tests/camera_diagnostics.test.cjs
      - name: Alternative camera diagnostic tests
        run: node tests/camera_alternatives.test.cjs
      - name: DWT Camera Lab 3 tests
        run: node tests/camera_lab_v3.test.cjs
      - name: DWT camera navigation matrix tests
        run: node tests/camera_navigation.test.cjs
      - name: DWT modal viability lab tests
        run: node tests/camera_modal_viability.test.cjs
      - name: DWT player control lab tests
        run: node tests/camera_player_control.test.cjs
      - name: DWT miniature-to-modal lab tests
        run: node tests/camera_mini_modal.test.cjs
      - name: DWT one-tap crop lab tests
        run: node tests/camera_one_tap.test.cjs
      - name: DWT camera switch reliability lab tests
        run: node tests/camera_switch_reliability.test.cjs
      - name: Three-camera playback handoff diagnostic tests
        run: node tests/camera_playback_handoff.test.cjs
